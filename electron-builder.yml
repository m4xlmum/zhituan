# 打包配置。
#
# productName 用中文是为了显示好看，但可执行文件名与产物名保持 ASCII：
# 中文文件名在部分工具链与杀软扫描下会出问题，而用户Data目录名已由
# 主进程的 app.setName('zhituan') 单独保证，不受此处影响。

appId: com.m4xlmum.zhituan
productName: 纸团

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  # pdf.js 的运行时只用到四个目录（cmaps / standard_fonts / wasm / iccs，约 4MB），
  # 由主进程那条 zhituan-pdf:// 协议直接从 app.asar 里读（见 services/pdfReader.ts）。
  # 其余几层一律挡在外面，合计约 65MB：
  #   build/ (12M) legacy/ (16M)  两份构建产物。渲染进程用的是 Vite 打进
  #       out/renderer 的那一份，运行时不需要 node_modules 里这份；
  #       legacy 是给旧浏览器准备的降级版，更不必带上
  #   web/ (1.6M)   pdf.js 自带的阅读器界面，我们有自己的阅读页
  #   types/ image_decoders/   类型声明、node 端的图像解码
  #   @napi-rs/canvas (37M)     pdfjs-dist 的一条**可选**依赖，装上了就是 37MB
  #       原生库；它只服务 node 端跑 pdf.js 的用法，桌面端一个字节都不碰
  - '!node_modules/@napi-rs/**'
  - '!node_modules/pdfjs-dist/build/**'
  - '!node_modules/pdfjs-dist/legacy/**'
  - '!node_modules/pdfjs-dist/web/**'
  - '!node_modules/pdfjs-dist/types/**'
  - '!node_modules/pdfjs-dist/image_decoders/**'
  - '!**/*.map'

# 托盘图标不打包进 asar，主进程以普通文件路径读取
extraResources:
  - from: resources/tray.ico
    to: tray.ico

win:
  executableName: zhituan
  icon: build/icon.ico
  artifactName: zhituan-${version}-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  # 不用一键安装：用户能自己选目录，也更容易信任
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 纸团
  installerLanguages: [zh_CN]
  # 2052 = 简体中文
  language: '2052'
  # 卸载时保留用户数据（书签、站点、登录态），重装后不至于全丢
  deleteAppDataOnUninstall: false
  # 安装器/卸载器的扩展钩子。修「升级时报 Failed to uninstall old application
  # files ... : 2」：旧卸载器改名搬移失败就 Abort（退出码 2），新版安装器随即
  # 弹框退出。这里在旧卸载器动手前先收干净进程，失败也不再中断升级。
  # 这个值就是默认值（buildResources 下的 installer.nsh），写出来是为了别被
  # 以后改 directories.buildResources 时悄悄弄丢。路径相对 buildResources 解析，
  # 所以只能写文件名，不能写 build/installer.nsh。
  include: installer.nsh

